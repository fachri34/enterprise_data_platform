services:

  metabase-db:
    image: postgres:16
    container_name: metabase-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
      POSTGRES_DB: metabase

    volumes:
      - metabase-db-data:/var/lib/postgresql/data

    networks:
      - enterprise-networks


  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: unless-stopped

    depends_on:
      - metabase-db

    ports:
      - "3000:3000"

    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
      MB_DB_HOST: metabase-db

    volumes:
      - metabase-data:/metabase-data

    networks:
      - enterprise-networks


volumes:

  metabase-db-data:
  metabase-data:


networks:

  enterprise-networks:
    external: true