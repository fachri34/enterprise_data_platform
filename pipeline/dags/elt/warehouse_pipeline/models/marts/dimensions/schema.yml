version: 2

models:

  - name: dim_customer

    columns:

      - name: customer_key
        tests:
          - unique
          - not_null

      - name: customer_id
        tests:
          - unique

  - name: dim_product

    columns:

      - name: product_key
        tests:
          - unique
          - not_null

      - name: product_id
        tests:
          - unique

  - name: dim_sales_territory

    columns:

      - name: sales_territory_key
        tests:
          - unique
          - not_null

      - name: sales_territory_id
        tests:
          - unique

  - name: dim_store

    columns:

      - name: store_key
        tests:
          - unique
          - not_null

      - name: store_id
        tests:
          - unique

  - name: dim_shipmethod

    columns:

      - name: shipmethod_key
        tests:
          - unique
          - not_null

      - name: shipmethod_id
        tests:
          - unique

  - name: dim_location

    columns:

      - name: location_key
        tests:
          - unique
          - not_null

      - name: location_name
        tests:
          - unique

  - name: dim_sales_person

    columns:

      - name: sales_person_key
        tests:
          - unique
          - not_null

      - name: sales_person_id
        tests:
          - unique
          
  - name: dim_date
    description: Calendar dimension used across all fact tables.

    columns:
      - name: date_key
        description: Surrogate key in YYYYMMDD format.
        tests:
          - unique
          - not_null

      - name: date_actual
        description: Calendar date.
        tests:
          - unique
          - not_null

      - name: year
        tests:
          - not_null

      - name: month
        tests:
          - not_null

      - name: day_of_month
        tests:
          - not_null