version: 2

models:

  - name: customer_churn_features
    description: >
      Monthly customer-level features used for churn prediction.
      Features are calculated using historical transactions available
      before the observation timestamp.

    columns:

      - name: customer_key
        description: >
          Surrogate key identifying the customer.
        tests:
          - not_null

      - name: event_timestamp
        description: >
          Monthly observation timestamp used as the point-in-time
          reference for feature calculation.
        tests:
          - not_null

      - name: customer_recency
        description: >
          Number of days since the customer's most recent order
          before the observation timestamp.
        tests:
          - not_null

      - name: customer_frequency
        description: >
          Total number of distinct orders placed by the customer
          before the observation timestamp.
        tests:
          - not_null

      - name: customer_monetary
        description: >
          Total net sales generated by the customer before the
          observation timestamp.
        tests:
          - not_null

      - name: orders_30d
        description: >
          Number of distinct orders placed by the customer during
          the 30 days before the observation timestamp.
        tests:
          - not_null

      - name: orders_90d
        description: >
          Number of distinct orders placed by the customer during
          the 90 days before the observation timestamp.
        tests:
          - not_null

      - name: avg_order_value
        description: >
          Average order value calculated as customer monetary value
          divided by customer order frequency.
        tests:
          - not_null


  - name: customer_churn_labels
    description: >
      Customer churn labels generated from future 90-day purchasing
      activity after the observation timestamp.

    columns:

      - name: customer_key
        description: >
          Surrogate key identifying the customer.
        tests:
          - not_null

      - name: event_timestamp
        description: >
          Observation timestamp corresponding to the feature snapshot.
        tests:
          - not_null

      - name: churn_90d
        description: >
          Binary churn label. 1 indicates that the customer placed
          no order during the 90 days following the observation
          timestamp. 0 indicates that the customer placed at least
          one order.
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]